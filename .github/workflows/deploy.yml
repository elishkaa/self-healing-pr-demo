name: Deploy API Server

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      # This step will PASS — kubeconform only checks schema, not security policy
      - name: Validate manifest schema with kubeconform
        run: kubeconform -strict k8s/deployment.yaml

  security-lint:
    name: Security Policy Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This step will FAIL because deployment.yaml runs as root (no securityContext)
      - name: Check for securityContext
        run: |
          if ! grep -q "runAsNonRoot" k8s/deployment.yaml; then
            echo "FAIL: No runAsNonRoot securityContext found. Container may run as root."
            exit 1
          fi
          echo "PASS: runAsNonRoot is set."

      # This step will FAIL because deployment.yaml has no resource requests or limits
      - name: Check for resource limits
        run: |
          if ! grep -q "resources:" k8s/deployment.yaml; then
            echo "FAIL: No resource requests/limits defined. Pod can consume unlimited cluster resources."
            exit 1
          fi
          echo "PASS: Resource limits are defined."

      # This step will FAIL because the image tag is "latest"
      - name: Check for pinned image tags
        run: |
          if grep -qE "image:.*:latest" k8s/deployment.yaml; then
            echo "FAIL: Image uses 'latest' tag. Deployments must pin to a specific version."
            exit 1
          fi
          echo "PASS: Image tag is pinned."

      # This step will FAIL because readinessProbe is missing entirely
      - name: Check for readinessProbe
        run: |
          if ! grep -q "readinessProbe" k8s/deployment.yaml; then
            echo "FAIL: No readinessProbe found. Service may receive traffic before it is ready."
            exit 1
          fi
          echo "PASS: readinessProbe is defined."

      # This step will FAIL because livenessProbe points to "/" instead of "/healthz"
      - name: Check livenessProbe path
        run: |
          if grep -A3 "livenessProbe:" k8s/deployment.yaml | grep -q 'path: "/"'; then
            echo "FAIL: livenessProbe points to '/' — use '/healthz' for a dedicated health endpoint."
            exit 1
          fi
          echo "PASS: livenessProbe path looks correct."

  deploy:
    name: Deploy to Cluster
    runs-on: ubuntu-latest
    needs: security-lint
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      # Skips gracefully if no real cluster is configured (demo mode)
      - name: Apply manifest
        run: |
          if [ ! -s $HOME/.kube/config ]; then
            echo "No KUBECONFIG secret set — skipping deploy (demo mode)."
            exit 0
          fi
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/api-server --timeout=120s
